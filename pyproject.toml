[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opentrials"
version = "1.0.0rc1"
description = "Open, reproducible virtual clinical-trial research infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenTrials contributors" }]
keywords = [
  "virtual clinical trials",
  "pbpk",
  "pharmacometrics",
  "pharmacokinetics",
  "systems pharmacology",
  "computational pharmacology",
  "mechanistic modeling",
  "scientific computing",
  "research software",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pint>=0.24,<1",
  "pyarrow>=18,<24",
  "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/eshkanala/OpenTrials"
Repository = "https://github.com/eshkanala/OpenTrials"
Documentation = "https://github.com/eshkanala/OpenTrials/tree/main/docs"
Issues = "https://github.com/eshkanala/OpenTrials/issues"

[project.scripts]
opentrials = "opentrials.cli.main:main"

[tool.hatch.build.targets.wheel.force-include]
"src/opentrials/adapters/osp/generate_population.R" = "opentrials/adapters/osp/generate_population.R"
"src/opentrials/adapters/osp/run_simulation.R" = "opentrials/adapters/osp/run_simulation.R"
"src/opentrials/adapters/osp/run_population_simulation.R" = "opentrials/adapters/osp/run_population_simulation.R"
"src/opentrials/adapters/osp/run_population_simulation_csv.R" = "opentrials/adapters/osp/run_population_simulation_csv.R"
"src/opentrials/adapters/osp/read_observed_dataset.R" = "opentrials/adapters/osp/read_observed_dataset.R"
"src/opentrials/adapters/osp/inspect_model.R" = "opentrials/adapters/osp/inspect_model.R"

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "osp_integration: opt-in tests that require the locally installed OSP R runtime",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["opentrials"]

name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest

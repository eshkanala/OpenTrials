schema: opentrials.trial
schema_version: 1.0.0
payload:
  trial_id: ACICLOVIR-IV-ENGINEERING-DEMO
  title: Aciclovir IV OSP engineering integration example
  question_of_interest: Can OpenTrials translate, verify, and execute a matching OSP IV intervention?
  population:
    id: healthy-adult-single-individual-v1
    size: 1
    seed: 42
    generator_version: 0.1.0
    age_range:
      minimum: {value: 18, unit: year, value_type: ASSUMED}
      maximum: {value: 65, unit: year, value_type: ASSUMED}
  arms:
    - arm_id: aciclovir-250-mg-iv
      name: Aciclovir 250 mg intravenous infusion over 10 min
      allocation: 1.0
      intervention:
        intervention_id: aciclovir-250-mg-iv-10-min
        compound:
          identity:
            compound_id: aciclovir
            preferred_name: Aciclovir
        regimen:
          regimen_id: aciclovir-single-iv-infusion
          doses:
            - amount: {value: 250, unit: mg, value_type: ASSUMED}
              route: INTRAVENOUS
              administration_time: {value: 0, unit: min, value_type: ASSUMED}
              infusion_duration: {value: 10, unit: min, value_type: ASSUMED}
  randomization: NONE
  endpoints:
    - endpoint_id: plasma-concentration
      endpoint_type: PK
      measurement: plasma aciclovir concentration
      time_window:
        start: {value: 0, unit: hour, value_type: ASSUMED}
        end: {value: 24, unit: hour, value_type: ASSUMED}
      aggregation: RAW
      missingness_rule: REPORT
      analysis_method: concentration-time profile
      unit: mg/L
  seed: 42
